services:
  postgres:
    image: postgres:15-alpine
    container_name: kosman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kosman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosman_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kosman}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kosman} -d ${POSTGRES_DB:-kosman}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kosman-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
